name: WordPress release
on:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(sed -n 's/^ \* Version: //p' spam-email-za.php)" == "$version" ]]
          [[ "$(jq -r .version update.json)" == "$version" ]]
          php -l spam-email-za.php
          php -l includes/Rules.php
          php tests/smoke.php
          mkdir -p package/spam-email-za/includes
          cp spam-email-za.php readme.txt LICENSE.txt package/spam-email-za/
          cp includes/Rules.php package/spam-email-za/includes/
          (cd package && zip -qr "../spam-email-za-$version.zip" spam-email-za)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "spam-email-za-${GITHUB_REF_NAME#v}.zip" update.json --verify-tag --generate-notes
