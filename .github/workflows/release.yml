name: WordPress release
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.0.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" == "v$version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(sed -n 's/^ \* Version: //p' spam-email-za.php)" == "$version" ]]
          [[ "$(jq -r .version update.json)" == "$version" ]]
          php -l spam-email-za.php
          php -l includes/Rules.php
          php tests/smoke.php
          mkdir -p package/spam-email-za/includes
          cp spam-email-za.php readme.txt LICENSE.txt package/spam-email-za/
          cp includes/Rules.php package/spam-email-za/includes/
          (cd package && zip -qr "../spam-email-za-$version.zip" spam-email-za)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" "spam-email-za-${RELEASE_TAG#v}.zip" update.json --verify-tag --generate-notes
